# Optional continuous deployment to Cloud Run using Workload Identity Federation (no stored keys).
# One-time setup: https://github.com/google-github-actions/auth#workload-identity-federation
# Then add repository variables: GCP_PROJECT_ID, GCP_REGION, GCP_AI_LOCATION, GCP_WIF_PROVIDER, GCP_DEPLOY_SA.
name: deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  cloud-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2
        with:
          service: fete
          region: ${{ vars.GCP_REGION }}
          source: .
          env_vars: GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }},GOOGLE_CLOUD_LOCATION=${{ vars.GCP_AI_LOCATION }},TRUST_PROXY=1
          flags: --allow-unauthenticated --service-account=fete-run@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com --max-instances=3 --cpu-boost
